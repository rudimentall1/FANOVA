name: FANOVA static security analysis

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/fanova-security.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/fanova-security.yml'

permissions:
  contents: read

jobs:
  slither:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned Slither analyzer
        run: python -m pip install slither-analyzer==0.11.4
      - name: Run Slither
        run: slither . --fail-high
