name: FANOVA contract tests

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/fanova-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - '.github/workflows/fanova-contracts.yml'

permissions:
  contents: read

jobs:
  test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check build and deployed bytecode sizes
        run: forge build --sizes
      - name: Run adversarial contract tests
        run: forge test -vvv
      - name: Prepare local deployment manifest
        run: node scripts/prepare-deployment-manifest.mjs
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanova-soneium-mainnet-manifest
          path: artifacts/fanova-soneium-mainnet-manifest.json
          if-no-files-found: error
