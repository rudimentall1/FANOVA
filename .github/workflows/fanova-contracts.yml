name: FANOVA contract tests

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - 'scripts/compare-fanova-deployed-bytecode.mjs'
      - '.github/workflows/fanova-contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'foundry.toml'
      - 'scripts/compare-fanova-deployed-bytecode.mjs'
      - '.github/workflows/fanova-contracts.yml'

permissions:
  contents: read

jobs:
  test-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Check build and deployed bytecode sizes
        run: forge build --sizes
      - name: Run adversarial contract tests
        run: forge test -vvv
      - name: Compare deployed runtime bytecode with current build
        run: node scripts/compare-fanova-deployed-bytecode.mjs
      - name: Diagnose metadata with explorer-exact source bytes
        shell: bash
        run: |
          set -euo pipefail
          source_file="contracts/src/FanovaProvenance.sol"
          backup_file="$(mktemp)"
          cp "$source_file" "$backup_file"
          restore_source() {
            cp "$backup_file" "$source_file"
            rm -f "$backup_file"
            forge build --force
          }
          trap restore_source EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path("contracts/src/FanovaProvenance.sol")
          data = p.read_bytes()
          if data.endswith(bytes([10])):
              p.write_bytes(data[:-1])
          PY
          echo "=== Diagnostic build: exact Blockscout source bytes, configured Cancun target ==="
          forge build --force --sizes
          node scripts/compare-fanova-deployed-bytecode.mjs
          restore_source
          trap - EXIT
      - name: Prepare local deployment manifest
        run: node scripts/prepare-deployment-manifest.mjs
      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanova-soneium-mainnet-manifest
          path: artifacts/fanova-soneium-mainnet-manifest.json
          if-no-files-found: error
