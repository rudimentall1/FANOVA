name: FANOVA Soneium read-only deployment check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-soneium-readonly.mjs'
      - '.github/workflows/soneium-readonly.yml'
      - 'docs/ONCHAIN_PROOF_DESIGN.md'
      - 'docs/ROADMAP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query chain ID and runtime bytecode (read-only)
        run: node scripts/verify-soneium-readonly.mjs
      - name: Check script syntax
        run: node --check scripts/verify-soneium-readonly.mjs
