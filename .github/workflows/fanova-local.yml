name: FANOVA local MVP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run domain tests
        working-directory: apps/web
        run: npm test
      - name: Check JavaScript syntax
        working-directory: apps/web
        run: |
          node --check app.js
          node --check domain.js
          node --check serve.mjs
