name: FANOVA local MVP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fanova
          POSTGRES_USER: fanova
          POSTGRES_PASSWORD: fanova_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanova -d fanova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and ABI test dependencies
        working-directory: apps/web
        run: npm install --no-save playwright ethers@6.15.0
      - name: Run domain, ABI, and transaction tests
        working-directory: apps/web
        run: |
          npm test
          node --test provenance-abi.test.js
          node --test transaction-lifecycle.test.js
      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium
      - name: Run browser end-to-end test
        working-directory: apps/web
        run: node --test e2e.test.js
      - name: Check JavaScript syntax
        working-directory: apps/web
        run: |
          node --check app.js
          node --check onchain-proof.js
          node --check onchain-workflow.js
          node --check provenance-abi.js
          node --check provenance-abi.test.js
          node --check transaction-lifecycle.js
          node --check transaction-lifecycle.test.js
          node --check verify-evidence.js
          node --check domain.js
          node --check serve.mjs
          node --check e2e.test.js
          node --check platform-e2e.test.js

      - name: Install platform dependencies
        working-directory: apps/platform
        run: npm install
      - name: Check platform TypeScript
        working-directory: apps/platform
        run: npm run typecheck
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Run platform authorization tests
        working-directory: apps/platform
        run: npm test
      - name: Generate and apply PostgreSQL migrations
        working-directory: apps/platform
        run: |
          npm run db:generate
          npm run db:migrate
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Validate Better Auth Drizzle schema
        working-directory: apps/platform
        run: npx auth@latest check schema --config ./src/lib/auth.ts
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Build platform application
        working-directory: apps/platform
        run: npm run build
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000

      - name: Start platform development server for end-to-end tests
        working-directory: apps/platform
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 > /tmp/fanova-platform.log 2>&1 &
          echo $! > /tmp/fanova-platform.pid
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_SIWE_DOMAIN: 127.0.0.1:3000
          FANOVA_SIWE_URI: http://127.0.0.1:3000
      - name: Wait for platform and database
        run: |
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fanova-platform.log
          exit 1
      - name: Run multi-account platform browser tests
        working-directory: apps/web
        run: node --test platform-e2e.test.js
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PLATFORM_URL: http://127.0.0.1:3000
          FANOVA_PLATFORM_LOG: /tmp/fanova-platform.log
          FANOVA_PLATFORM_DIR: ${{ github.workspace }}/apps/platform
          FANOVA_ADMIN_BOOTSTRAP_SCRIPT: ${{ github.workspace }}/apps/platform/scripts/bootstrap-e2e-admin.mjs
          FANOVA_E2E_ADMIN_BOOTSTRAP: "true"
