name: FANOVA local MVP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fanova
          POSTGRES_USER: fanova
          POSTGRES_PASSWORD: fanova_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanova -d fanova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and ABI test dependencies
        working-directory: apps/web
        run: npm install
      - name: Report browser-test dependency advisories
        working-directory: apps/web
        run: |
          npm audit --json > /tmp/fanova-web-audit.json || true
          node <<'NODE'
          const report = require("/tmp/fanova-web-audit.json");
          console.log("Browser-test dependency totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: advisory.severity,
              direct: advisory.isDirect,
              affected: advisory.range,
              fixAvailable: advisory.fixAvailable,
              via: advisory.via.map((entry) => typeof entry === "string" ? entry : entry.title)
            }));
          }
          NODE
      - name: Run domain, ABI, and transaction tests
        working-directory: apps/web
        run: |
          npm test
          node --test provenance-abi.test.js
          node --test transaction-lifecycle.test.js
      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium
      - name: Run browser end-to-end test
        working-directory: apps/web
        run: node --test e2e.test.js
      - name: Check JavaScript syntax
        working-directory: apps/web
        run: |
          node --check app.js
          node --check onchain-proof.js
          node --check onchain-workflow.js
          node --check provenance-abi.js
          node --check provenance-abi.test.js
          node --check transaction-lifecycle.js
          node --check transaction-lifecycle.test.js
          node --check verify-evidence.js
          node --check domain.js
          node --check serve.mjs
          node --check e2e.test.js
          node --check platform-e2e.test.js

      - name: Install platform dependencies
        working-directory: apps/platform
        run: npm install
      - name: Report npm security advisories
        working-directory: apps/platform
        run: |
          npm audit --json > /tmp/fanova-audit-full.json || true
          npm audit --omit=dev --json > /tmp/fanova-audit-production.json || true
          node <<'NODE'
          const fs = require("node:fs");
          for (const [label, file] of [
            ["all dependencies", "/tmp/fanova-audit-full.json"],
            ["production dependencies", "/tmp/fanova-audit-production.json"]
          ]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`\n=== ${label} ===`);
            console.log("Totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = item.via.map((entry) =>
                typeof entry === "string" ? entry : `${entry.title} [${entry.url ?? "no advisory URL"}]`
              );
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                affected: item.range,
                fixAvailable: item.fixAvailable,
                advisories
              }));
            }
          }
          NODE
      - name: Check platform TypeScript
        working-directory: apps/platform
        run: npm run typecheck
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Run platform authorization tests
        working-directory: apps/platform
        run: npm test
      - name: Check Drizzle migration drift and apply versioned migrations
        working-directory: apps/platform
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "Drizzle schema changed without a committed migration."
            echo "Run npm run db:generate and commit the generated files under apps/platform/drizzle/."
            git status --short -- drizzle
            exit 1
          fi
          npm run db:migrate
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Validate Better Auth Drizzle schema
        working-directory: apps/platform
        run: npx auth@latest check schema --config ./src/lib/auth.ts
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Build platform application
        working-directory: apps/platform
        run: npm run build
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"

      - name: Start platform development server for end-to-end tests
        working-directory: apps/platform
        run: |
          export FANOVA_SIWE_DOMAIN=127.0.0.1:3000
          export FANOVA_SIWE_URI=http://127.0.0.1:3000
          nohup npm run dev -- --hostname 127.0.0.1 > /tmp/fanova-platform.log 2>&1 &
          echo $! > /tmp/fanova-platform.pid
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"
      - name: Wait for platform and database
        run: |
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fanova-platform.log
          exit 1
      - name: Run multi-account platform browser tests
        working-directory: apps/web
        run: node --test platform-e2e.test.js
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PLATFORM_URL: http://127.0.0.1:3000
          FANOVA_PLATFORM_LOG: /tmp/fanova-platform.log
          FANOVA_PLATFORM_DIR: ${{ github.workspace }}/apps/platform
          FANOVA_ADMIN_BOOTSTRAP_SCRIPT: ${{ github.workspace }}/apps/platform/scripts/bootstrap-e2e-admin.mjs
          FANOVA_E2E_PROVENANCE_BOOTSTRAP_SCRIPT: ${{ github.workspace }}/apps/platform/scripts/bootstrap-e2e-provenance.mjs
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"
          FANOVA_E2E_ADMIN_BOOTSTRAP: "true"

  persist-updated-npm-lockfiles:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 50 && github.event.pull_request.head.ref == 'fix/drizzle-baseline-artifact' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the PR source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate platform lockfile without install scripts
        working-directory: apps/platform
        run: npm install --package-lock-only --ignore-scripts
      - name: Generate web lockfile without install scripts
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit both lockfiles to the PR branch
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git add apps/platform/package-lock.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: lock platform and web dependency graphs"
          git push origin "HEAD:${PR_BRANCH}"
