name: FANOVA local MVP checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fanova
          POSTGRES_USER: fanova
          POSTGRES_PASSWORD: fanova_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanova -d fanova"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and ABI test dependencies
        working-directory: apps/web
        run: npm ci
      - name: Report browser-test dependency advisories
        working-directory: apps/web
        run: |
          npm audit --json > /tmp/fanova-web-audit.json || true
          node <<'NODE'
          const report = require("/tmp/fanova-web-audit.json");
          console.log("Browser-test dependency totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          const totals = report.metadata?.vulnerabilities ?? {};
          if ((totals.high ?? 0) + (totals.critical ?? 0) > 0) {
            console.error("High or critical browser-test dependency advisories block CI.");
            process.exitCode = 1;
          }
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: advisory.severity,
              direct: advisory.isDirect,
              affected: advisory.range,
              fixAvailable: advisory.fixAvailable,
              via: advisory.via.map((entry) => typeof entry === "string" ? entry : entry.title)
            }));
          }
          NODE
      - name: Run domain, ABI, and transaction tests
        working-directory: apps/web
        run: |
          npm test
          node --test provenance-abi.test.js
          node --test transaction-lifecycle.test.js
      - name: Install Chromium
        working-directory: apps/web
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser end-to-end test
        working-directory: apps/web
        run: node --test e2e.test.js
      - name: Check JavaScript syntax
        working-directory: apps/web
        run: |
          node --check app.js
          node --check onchain-proof.js
          node --check onchain-workflow.js
          node --check provenance-abi.js
          node --check provenance-abi.test.js
          node --check transaction-lifecycle.js
          node --check transaction-lifecycle.test.js
          node --check verify-evidence.js
          node --check domain.js
          node --check serve.mjs
          node --check e2e.test.js
          node --check platform-e2e.test.js
          node --check platform-persistence-e2e.test.js

      - name: Install platform dependencies
        working-directory: apps/platform
        run: npm ci
      - name: Report npm security advisories
        working-directory: apps/platform
        run: |
          npm audit --json > /tmp/fanova-audit-full.json || true
          npm audit --omit=dev --json > /tmp/fanova-audit-production.json || true
          node <<'NODE'
          const fs = require("node:fs");
          for (const [label, file] of [
            ["all dependencies", "/tmp/fanova-audit-full.json"],
            ["production dependencies", "/tmp/fanova-audit-production.json"]
          ]) {
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            console.log(`\n=== ${label} ===`);
            console.log("Totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            const totals = report.metadata?.vulnerabilities ?? {};
            if ((totals.high ?? 0) + (totals.critical ?? 0) > 0) {
              console.error(`High or critical advisories block CI for ${label}.`);
              process.exitCode = 1;
            }
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = item.via.map((entry) =>
                typeof entry === "string" ? entry : `${entry.title} [${entry.url ?? "no advisory URL"}]`
              );
              console.log(JSON.stringify({
                name,
                severity: item.severity,
                direct: item.isDirect,
                affected: item.range,
                fixAvailable: item.fixAvailable,
                advisories
              }));
            }
          }
          NODE
      - name: Check platform TypeScript
        working-directory: apps/platform
        run: npm run typecheck
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Run platform authorization tests
        working-directory: apps/platform
        run: npm test
      - name: Check Drizzle migration drift and apply versioned migrations
        working-directory: apps/platform
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "Drizzle schema changed without a committed migration."
            echo "Run npm run db:generate and commit the generated files under apps/platform/drizzle/."
            git status --short -- drizzle
            exit 1
          fi
          npm run db:migrate
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Validate Better Auth Drizzle schema
        working-directory: apps/platform
        run: npm run auth:check
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
      - name: Build platform application
        working-directory: apps/platform
        run: npm run build
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"

      - name: Start platform development server for end-to-end tests
        working-directory: apps/platform
        run: |
          export FANOVA_SIWE_DOMAIN=127.0.0.1:3000
          export FANOVA_SIWE_URI=http://127.0.0.1:3000
          nohup ./node_modules/.bin/next dev --hostname 127.0.0.1 > /tmp/fanova-platform.log 2>&1 </dev/null &
          echo $! > /tmp/fanova-platform.pid
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"
      - name: Wait for platform and database
        run: |
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fanova-platform.log
          exit 1
      - name: Run multi-account platform browser tests
        working-directory: apps/web
        run: node --test platform-e2e.test.js
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PLATFORM_URL: http://127.0.0.1:3000
          FANOVA_PLATFORM_LOG: /tmp/fanova-platform.log
          FANOVA_PLATFORM_DIR: ${{ github.workspace }}/apps/platform
          FANOVA_ADMIN_BOOTSTRAP_SCRIPT: ${{ github.workspace }}/apps/platform/scripts/bootstrap-e2e-admin.mjs
          FANOVA_E2E_PROVENANCE_BOOTSTRAP_SCRIPT: ${{ github.workspace }}/apps/platform/scripts/bootstrap-e2e-provenance.mjs
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"
          FANOVA_E2E_ADMIN_BOOTSTRAP: "true"

      - name: Stop the first platform process
        run: |
          pid="$(cat /tmp/fanova-platform.pid)"
          kill -TERM "$pid"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Platform process did not exit after SIGTERM."
            cat /tmp/fanova-platform.log
            exit 1
          fi
          for attempt in $(seq 1 15); do
            if ! curl --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "The old platform server is still responding after its process exited."
          ps -ef | grep -E '[n]ext dev|[n]ext-server' || true
          cat /tmp/fanova-platform.log
          exit 1
      - name: Start a fresh platform process against the same PostgreSQL database
        working-directory: apps/platform
        run: |
          export FANOVA_SIWE_DOMAIN=127.0.0.1:3000
          export FANOVA_SIWE_URI=http://127.0.0.1:3000
          nohup ./node_modules/.bin/next dev --hostname 127.0.0.1 > /tmp/fanova-platform-restart.log 2>&1 </dev/null &
          echo $! > /tmp/fanova-platform-restart.pid
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"
      - name: Wait for restarted platform process
        run: |
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fanova-platform-restart.log
          exit 1
      - name: Verify persisted work and contribution after restart
        working-directory: apps/web
        run: node --test platform-persistence-e2e.test.js
        env:
          FANOVA_PLATFORM_URL: http://127.0.0.1:3000

      - name: Stop the platform process before PostgreSQL restart
        run: |
          pid="$(cat /tmp/fanova-platform-restart.pid)"
          kill -TERM "$pid"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "Platform process did not exit before PostgreSQL restart."
            cat /tmp/fanova-platform-restart.log
            exit 1
          fi
          for attempt in $(seq 1 15); do
            if ! curl --connect-timeout 1 --max-time 2 --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Application still responds after its process exited."
          exit 1
      - name: Restart the disposable PostgreSQL service container
        run: |
          mapfile -t postgres_ids < <(docker ps --filter "ancestor=postgres:16-alpine" --format "{{.ID}}")
          if [ "${#postgres_ids[@]}" -ne 1 ]; then
            echo "Expected exactly one PostgreSQL 16 CI service container; found ${#postgres_ids[@]}."
            docker ps --format "table {{.ID}}\t{{.Image}}\t{{.Names}}"
            exit 1
          fi
          postgres_id="${postgres_ids[0]}"
          before_started_at="$(docker inspect --format '{{.State.StartedAt}}' "$postgres_id")"
          docker restart "$postgres_id"
          ready=false
          for attempt in $(seq 1 60); do
            health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$postgres_id")"
            if [ "$health" = "healthy" ] && docker exec "$postgres_id" pg_isready -U fanova -d fanova >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            echo "PostgreSQL did not recover to a healthy state after container restart."
            docker logs --tail 100 "$postgres_id"
            exit 1
          fi
          after_started_at="$(docker inspect --format '{{.State.StartedAt}}' "$postgres_id")"
          if [ "$before_started_at" = "$after_started_at" ]; then
            echo "PostgreSQL container start time did not change; restart was not proven."
            exit 1
          fi
          echo "PostgreSQL container $postgres_id restarted successfully."
          echo "StartedAt changed from $before_started_at to $after_started_at."
      - name: Start a fresh platform process after PostgreSQL restart
        working-directory: apps/platform
        run: |
          export FANOVA_SIWE_DOMAIN=127.0.0.1:3000
          export FANOVA_SIWE_URI=http://127.0.0.1:3000
          nohup ./node_modules/.bin/next dev --hostname 127.0.0.1 > /tmp/fanova-platform-db-restart.log 2>&1 </dev/null &
          echo $! > /tmp/fanova-platform-db-restart.pid
        env:
          DATABASE_URL: postgres://fanova:fanova_dev_only@localhost:5432/fanova
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://127.0.0.1:3000
          FANOVA_PROVENANCE_CONTRACT: "0x3A302Cbb8570a76E8e7E1Dc15A763552A3c40880"
      - name: Wait for platform after PostgreSQL restart
        run: |
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fanova-platform-db-restart.log
          exit 1
      - name: Verify persisted work and contribution after PostgreSQL restart
        working-directory: apps/web
        run: node --test platform-persistence-e2e.test.js
        env:
          FANOVA_PLATFORM_URL: http://127.0.0.1:3000
